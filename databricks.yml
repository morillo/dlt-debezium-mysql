# Databricks Asset Bundle for the single-table Debezium CDC pipeline.
#
# One bundle, three SDLC targets. Deploy with:
#   databricks bundle deploy -t dev|test|prod
# Every source-specific value is a variable, so one deployment per
# source table is configured entirely from the command line or CI:
#   databricks bundle deploy -t dev --var="tablename=customers"

bundle:
  name: dlt-debezium-mysql

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the pipeline's datasets.
    default: cdc_dev
  target_schema:
    description: Unity Catalog schema for the bronze/silver tables.
    default: cdc_single
  landing_root:
    description: Directory (e.g. a UC volume) where Debezium events land.
    default: /Volumes/cdc_dev/landing/debezium
  database:
    description: Source MySQL database name.
    default: inventory
  tablename:
    description: Source MySQL table name.
    default: customers
  tablekeys:
    description: Comma-separated primary-key columns for the merge.
    default: id

targets:
  dev:
    mode: development # prefixes resources per user, allows destructive dev
    default: true
    # workspace:
    #   host: https://<your-dev-workspace>.cloud.databricks.com

  test:
    mode: production # deployed by CI as a service principal, no prefixing
    variables:
      catalog: cdc_test
      landing_root: /Volumes/cdc_test/landing/debezium
    # workspace:
    #   host: https://<your-test-workspace>.cloud.databricks.com
    # run_as:
    #   service_principal_name: <test-sp-application-id>

  prod:
    mode: production
    variables:
      catalog: cdc_prod
      landing_root: /Volumes/cdc_prod/landing/debezium
    # workspace:
    #   host: https://<your-prod-workspace>.cloud.databricks.com
    # run_as:
    #   service_principal_name: <prod-sp-application-id>
